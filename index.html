<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AREVIC Studio | Arquitectura en evolución constante</title>
  <meta name="description" content="Donde la Arquitectura Evoluciona y se Preserva como Organismo Vivo">
  
  <link rel="icon" href="https://arevicstudio.com/index_files/favicon-dark.png" media="(prefers-color-scheme: light)">
  <link rel="icon" href="https://arevicstudio.com/index_files/favicon-light.png" media="(prefers-color-scheme: dark)">

  <style>
    :root {
      --bg-dark: #080d16;
      --font-hud: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-drag: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-dark);
      color: #ffffff;
      font-family: var(--font-hud);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      position: relative;
    }

    /* ========================================================
       1. FONDO ORIGINAL CON ROTACIÓN AUTOMÁTICA EN VERTICAL
       ======================================================== */
    .hud-background {
      position: fixed;
      top: 50%;
      left: 50%;
      width: 100vw;
      height: 100vh;
      transform: translate(-50%, -50%);
      background: #080d16 url('./index_files/d65c4ab531d8aaf7f22ab3abc5617576.png') center center / cover no-repeat;
      z-index: -2;
      pointer-events: none;
      transition: transform 0.45s cubic-bezier(0.2, 0.8, 0.2, 1), width 0.45s ease, height 0.45s ease;
    }

    .hud-circuit-layer {
      position: fixed;
      top: 50%;
      left: 50%;
      width: 100vw;
      height: 100vh;
      transform: translate(-50%, -50%);
      background: url('./index_files/88057707fa37ae52ca1ba44eea053f03.png') center center / contain no-repeat;
      opacity: 0.18;
      z-index: -1;
      pointer-events: none;
      transition: transform 0.45s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    /* Rotación de 90° en vertical para aprovechar el formato horizontal de la textura */
    @media (orientation: portrait), (max-width: 899px) {
      .hud-background {
        width: 100vh;
        height: 100vw;
        transform: translate(-50%, -50%) rotate(90deg);
      }
      .hud-circuit-layer {
        width: 100vh;
        height: 100vw;
        transform: translate(-50%, -50%) rotate(90deg);
      }
    }

    /* ========================================================
       2. ESTRUCTURA Y CABECERA (LOGO ORIGINAL)
       ======================================================== */
    .hud-wrapper {
      width: 100%;
      max-width: 1350px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      animation: arevic-entrance 0.8s ease-out both;
    }

    @keyframes arevic-entrance {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .hud-brand {
      grid-area: brand;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-bottom: 8px;
    }

    .brand-logo-img {
      height: 48px;
      width: auto;
      object-fit: contain;
      filter: drop-shadow(0 0 10px rgba(255, 30, 60, 0.5));
    }

    .brand-slogan {
      font-size: 0.72rem;
      letter-spacing: 0.26em;
      color: #7b8fa3;
      text-transform: uppercase;
      margin-top: 6px;
      text-align: center;
    }

    /* ========================================================
       3. GRILLA RESPONSIVA: COCKPIT Y MÓVIL
       ======================================================== */
    .hud-grid {
      display: grid;
      width: 100%;
      align-items: center;
      justify-content: center;
    }

    /* MODO HORIZONTAL (Desktop / Móvil volteado) */
    @media (orientation: landscape) and (min-width: 900px) {
      .hud-grid {
        grid-template-columns: 240px 420px 240px;
        grid-template-areas:
          "social   brand   contacto"
          "social   core    contacto"
          "media    core    portafolio"
          "media    web     portafolio";
        gap: 14px 28px;
      }
      .hud-brand {
        margin-bottom: -15px;
      }
    }

    /* MODO VERTICAL (Smartphones / Retrato) */
    @media (orientation: portrait), (max-width: 899px) {
      .hud-grid {
        grid-template-columns: 1fr 1fr;
        grid-template-areas:
          "brand        brand"
          "social       contacto"
          "core         core"
          "media        portafolio"
          "web          web";
        gap: 12px 14px;
        max-width: 440px;
      }
      .brand-logo-img {
        height: 38px;
      }
      .brand-slogan {
        font-size: 0.65rem;
      }
    }

    .group-social     { grid-area: social; }
    .group-contacto   { grid-area: contacto; }
    .group-media      { grid-area: media; }
    .group-portafolio { grid-area: portafolio; }
    .group-web        { grid-area: web; }
    .hud-core         { grid-area: core; }

    .hud-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
    }

    .group-label {
      font-size: 0.68rem;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: #7b8fa3;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-bottom: 2px;
    }

    .group-label::before,
    .group-label::after {
      content: '';
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(94, 224, 224, 0.3), transparent);
    }

    /* ========================================================
       4. BOTONES CAPSULARES (OPTIMIZADOS EN VERTICAL)
       ======================================================== */
    .hud-btn {
      --neon: 94, 224, 224;
      position: relative;
      display: flex;
      align-items: center;
      background: linear-gradient(135deg, rgba(14, 23, 38, 0.85) 0%, rgba(8, 14, 24, 0.95) 100%);
      border: 1px solid rgba(var(--neon), 0.38);
      border-radius: 36px;
      text-decoration: none;
      color: #ffffff;
      cursor: pointer;
      overflow: hidden;
      transition: all 0.22s cubic-bezier(0.2, 0.8, 0.2, 1);
      box-shadow: 0 0 6px 0px rgba(var(--neon), 0.18), inset 0 0 6px rgba(var(--neon), 0.12);
      backdrop-filter: blur(8px);
      width: 100%;
      height: 48px;
      padding: 0 14px;
    }

    .hud-btn::before {
      content: '';
      position: absolute;
      inset: 2px;
      border-radius: 34px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      pointer-events: none;
    }

    .hud-btn:hover {
      background: linear-gradient(135deg, rgba(22, 38, 62, 0.9) 0%, rgba(10, 18, 32, 0.95) 100%);
      border-color: rgba(var(--neon), 0.9);
      box-shadow: 0 0 14px 2px rgba(var(--neon), 0.6), inset 0 0 8px rgba(var(--neon), 0.3);
      transform: translateY(-1px) scale(1.02);
    }

    .btn-icon-wrapper {
      width: 26px;
      height: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-right: 10px;
    }

    .btn-icon-wrapper img,
    .btn-icon-wrapper svg {
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 0 4px rgba(var(--neon), 0.45));
    }

    .btn-text {
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      white-space: nowrap;
      color: #f0f5fb;
    }

    /* Optimización de tamaño de botones en modo vertical */
    @media (orientation: portrait), (max-width: 899px) {
      .hud-btn {
        height: 42px;
        padding: 0 10px;
        border-radius: 28px;
      }
      .btn-icon-wrapper {
        width: 22px;
        height: 22px;
        margin-right: 6px;
      }
      .btn-text {
        font-size: 0.68rem;
        letter-spacing: 0.08em;
      }
      /* Reducción especial de ancho para el bloque WEB en móvil */
      .group-web {
        align-items: center;
      }
      .group-web .hud-btn {
        max-width: 200px;
      }
    }

    /* Colores Neón Identitarios */
    .btn-facebook   { --neon: 24, 119, 242; }
    .btn-instagram  { --neon: 225, 48, 108; }
    .btn-tiktok     { --neon: 37, 244, 238; }
    .btn-whatsapp   { --neon: 37, 211, 102; }
    .btn-correo     { --neon: 0, 180, 216; }
    .btn-ubicacion  { --neon: 0, 220, 255; }
    .btn-youtube    { --neon: 255, 0, 0; }
    .btn-reels      { --neon: 255, 59, 130; }
    .btn-behance    { --neon: 23, 105, 255; }
    .btn-gallery    { --neon: 0, 229, 255; }
    .btn-proyectos  { --neon: 255, 77, 77; }
    .btn-website    { --neon: 0, 245, 255; }
    .btn-tour       { --neon: 0, 200, 255; }
    .btn-about      { --neon: 255, 255, 255; }

    /* ========================================================
       5. NÚCLEO CENTRAL HOLOGRÁFICO CON MONOLITO COMPLETO
       ======================================================== */
    .hud-core {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 380px;
      height: 380px;
      margin: 0 auto;
      cursor: pointer;
    }

    /* Ruedas/Anillos giratorios originales */
    .hud-core::before,
    .hud-core::after {
      content: '';
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
    }

    .hud-core::before {
      width: 340px;
      height: 340px;
      border: 1.5px dashed rgba(94, 224, 224, 0.4);
      border-top-color: rgba(239, 68, 68, 0.7);
      border-right-color: rgba(239, 68, 68, 0.7);
      animation: core-spin 18s linear infinite;
    }

    .hud-core::after {
      width: 370px;
      height: 370px;
      border: 1px dotted rgba(239, 68, 68, 0.35);
      animation: core-spin-reverse 26s linear infinite;
    }

    @keyframes core-spin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    @keyframes core-spin-reverse {
      from { transform: rotate(360deg); }
      to   { transform: rotate(0deg); }
    }

    /* Disco/Base metálica del reactor */
    .core-base-disc {
      position: absolute;
      width: 320px;
      height: 320px;
      object-fit: contain;
      z-index: 1;
      filter: drop-shadow(0 0 14px rgba(239, 68, 68, 0.35));
      transition: filter 0.3s ease, transform 0.3s ease;
    }

    /* Monolito 3D Cristalino Superpuesto */
    .core-spire-monolith {
      position: absolute;
      width: 175px;
      height: 250px;
      object-fit: contain;
      z-index: 2;
      animation: spire-breathe 4s infinite alternate ease-in-out;
      transition: transform 0.3s ease, filter 0.3s ease;
    }

    @keyframes spire-breathe {
      0%   { filter: drop-shadow(0 0 8px rgba(239, 68, 68, 0.5)); transform: scale(0.97); }
      100% { filter: drop-shadow(0 0 18px rgba(239, 68, 68, 0.85)) drop-shadow(0 0 8px rgba(0, 240, 255, 0.4)); transform: scale(1.02); }
    }

    .hud-core:hover .core-base-disc {
      filter: drop-shadow(0 0 22px rgba(239, 68, 68, 0.65)) brightness(1.15);
      transform: scale(1.02);
    }

    .hud-core:hover .core-spire-monolith {
      filter: drop-shadow(0 0 26px rgba(239, 68, 68, 0.95)) drop-shadow(0 0 12px rgba(0, 240, 255, 0.6)) brightness(1.2);
      transform: scale(1.04);
    }

    /* Escala proporcional del núcleo en pantallas verticales */
    @media (orientation: portrait), (max-width: 899px) {
      .hud-core {
        width: 250px;
        height: 250px;
      }
      .hud-core::before { width: 225px; height: 225px; }
      .hud-core::after  { width: 245px; height: 245px; }
      .core-base-disc   { width: 215px; height: 215px; }
      .core-spire-monolith { width: 120px; height: 170px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, ::before, ::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>

  <script>
    // Detección reactiva de orientación en navegadores móviles
    function syncOrientation() {
      const isLandscape = window.matchMedia("(orientation: landscape)").matches;
      document.body.classList.toggle('is-landscape', isLandscape);
      document.body.classList.toggle('is-portrait', !isLandscape);
    }
    window.addEventListener('resize', syncOrientation);
    window.addEventListener('orientationchange', syncOrientation);
    syncOrientation();

    // Redirección del núcleo central
    document.getElementById('arevic-core-button').addEventListener('click', function() {
      window.open('https://arevicstudio.com/', '_blank');
    });
  </script>
