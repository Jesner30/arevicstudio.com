<script>
(function () {
  var NATIVE_WIDTH = 1692;
  var NATIVE_HEIGHT = 898;

  function fitCanvas() {
    var canvas = document.querySelector('._8jGYJw');
    if (!canvas) return;
    var wrapper = canvas.parentElement;
    if (!wrapper) return;

    var scale = window.innerWidth / NATIVE_WIDTH;

    canvas.style.transformOrigin = 'top left';
    canvas.style.transform = 'scale(' + scale + ')';

    wrapper.style.width = (NATIVE_WIDTH * scale) + 'px';
    wrapper.style.height = (NATIVE_HEIGHT * scale) + 'px';
    wrapper.style.overflow = 'hidden';
    wrapper.style.flexShrink = '0';
  }

  window.addEventListener('DOMContentLoaded', fitCanvas);
  window.addEventListener('load', fitCanvas);
  window.addEventListener('resize', fitCanvas);
  window.addEventListener('orientationchange', fitCanvas);

  /* ================= Integrar área de Clic interactiva para todo el contenedor ================= */
  const buttonIds = [
    '#LBRpCKMJWnTnM1Fy', '#LBCrSwxDzDvc4t9y', '#LBrY3GWBT9hccdHb', 
    '#LBVr82yYYnsJc0df', '#LB8NQ3hgGmFzzq1z', '#LBnhGPyl8GVPfptD', 
    '#LBpt780nQwQ6P2j0', '#LBfydFWm1yN7Tpwh'
  ];
  
  buttonIds.forEach(id => {
    const btn = document.querySelector(id);
    if (btn) {
      const link = btn.querySelector('a');
      if (link) {
        btn.addEventListener('click', (e) => {
          if (e.target.tagName.toLowerCase() !== 'a') {
            window.open(link.href, link.target || '_self');
          }
        });
      }
    }
  });

})();
